<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e8">
  <title>每日影片重點庫</title>
  <style>
    :root{--paper:#f6f1e8;--ink:#17211d;--muted:#66716b;--card:#fffdf8;--line:#ded8cc;--accent:#126b55;--soft:#e0eee8;--warn:#8b4d27}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.65}
    header{padding:52px 20px 28px;border-bottom:1px solid var(--line);background:linear-gradient(145deg,#f6f1e8 0%,#e1eee8 100%)}
    .wrap{width:min(920px,calc(100% - 32px));margin:auto}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:800}h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(34px,8vw,64px);line-height:1.05;margin:10px 0 12px}.lead{color:var(--muted);max-width:620px;margin:0}
    .tools{display:grid;grid-template-columns:1fr 190px;gap:10px;margin:24px auto}.tools input,.tools select{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--card);font-size:16px;color:var(--ink)}
    .status{font-size:13px;color:var(--muted);margin:4px 0 16px}.digest{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(23,33,29,.05)}
    .meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.tag{background:var(--soft);color:var(--accent);padding:3px 9px;border-radius:999px;font-weight:700}.digest h2{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(23px,5vw,32px);line-height:1.25;margin:14px 0 6px}.source{color:var(--muted);font-size:14px}.conclusion{border-left:4px solid var(--accent);padding:11px 14px;margin:18px 0;background:#f1f7f4;border-radius:0 10px 10px 0}.conclusion strong{display:block;color:var(--accent);font-size:13px;margin-bottom:3px}
    details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:800;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"＋";float:right;color:var(--accent)}details[open] summary:after{content:"－"}.section{padding-top:8px}.section ul{padding-left:21px;margin:6px 0}.section li{margin:7px 0}.skip{color:var(--muted)}.risk{color:var(--warn)}
    .watch{display:inline-block;margin-top:14px;color:white;background:var(--accent);padding:10px 15px;border-radius:10px;text-decoration:none;font-weight:750}.empty{text-align:center;padding:60px 10px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 16px 50px}
    @media(max-width:620px){header{padding-top:36px}.wrap{width:min(100% - 22px,920px)}.tools{grid-template-columns:1fr}.digest{padding:17px;border-radius:15px}.meta{gap:6px}.tag{font-size:12px}}
  </style>
</head>
<body>
  <header><div class="wrap"><div class="eyebrow">WATCHNOTE · 每日更新</div><h1>影片重點庫</h1><p class="lead">把冗長影片整理成可快速閱讀、可回查時間碼的重點筆記。分類會依每天素材彈性增加。</p></div></header>
  <main class="wrap">
    <div class="tools"><input id="search" type="search" placeholder="搜尋標題、結論、個股或主題"><select id="category"><option value="">所有分類</option></select></div>
    <div id="status" class="status">正在讀取最新內容…</div><section id="list"></section>
  </main>
  <footer>內容為影片主張的整理與風險檢視，不構成投資或專業建議。</footer>
  <script>
    const DATA_URL='data/video_digests.json';
    const list=document.querySelector('#list'), search=document.querySelector('#search'), category=document.querySelector('#category'), status=document.querySelector('#status'); let rows=[];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const bullets=a=>`<ul>${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    function render(){const q=search.value.trim().toLowerCase(), cat=category.value; const filtered=rows.filter(r=>(!cat||(r.categories||[]).includes(cat))&&(!q||JSON.stringify(r).toLowerCase().includes(q))); status.textContent=`共 ${rows.length} 篇 · 顯示 ${filtered.length} 篇`;
      list.innerHTML=filtered.map(r=>`<article class="digest"><div class="meta"><span>${esc(r.date)}</span><span>·</span><span>${esc(r.duration)}</span>${(r.categories||[]).map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div><h2>${esc(r.title)}</h2><div class="source">${esc(r.source)}</div><div class="conclusion"><strong>一句話結論</strong>${esc(r.conclusion)}</div><details open><summary>市場／核心判斷</summary><div class="section">${bullets(r.market)}</div></details><details><summary>個股與族群觀點</summary><div class="section">${bullets(r.stocks)}</div></details><details><summary>操作方法</summary><div class="section">${bullets(r.actions)}</div></details><details><summary>可略過部分</summary><div class="section skip">${esc(r.skip)}</div></details><details><summary>風險與邏輯漏洞</summary><div class="section risk">${bullets(r.risks)}</div></details><a class="watch" href="${esc(r.url)}" target="_blank" rel="noopener">開啟原始影片 ↗</a></article>`).join('')||'<div class="empty">找不到符合條件的內容</div>'}
    fetch(DATA_URL+'?v='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{rows=data.digests||[];[...new Set(rows.flatMap(r=>r.categories||[]))].sort().forEach(c=>category.add(new Option(c,c)));render()}).catch(()=>{status.textContent='目前無法讀取內容，請稍後重新整理。';list.innerHTML='<div class="empty">讀取失敗</div>'});
    search.addEventListener('input',render);category.addEventListener('change',render);
  </script>
</body>
</html>
